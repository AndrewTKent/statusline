name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every job runs on my own runners on hound. A job runs only for a push, a dispatch, or a PR whose
# branch lives in this repo; a fork's PR is refused here as well as held for approval in the repo's
# Actions settings, so code from outside never gets a runner.
jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, sl-hound]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        run: |
          files=()
          for f in bin/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sh | *.bash) files+=("$f") ;;
              *) head -n1 "$f" | grep -Eqs '^#! */[^ ]*/(env *)?[abk]*sh' && files+=("$f") ;;
            esac
          done
          shellcheck --version | sed -n 2p
          shellcheck -S error "${files[@]}" install.sh install-account-router.sh uninstall.sh install-codex.sh shell/claude-supervised shell/codex-supervised test/test_install_account_router.sh linux/systemd/install-agents.sh

  test-claude:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, sl-hound]
    timeout-minutes: 10
    steps:
      - name: Fresh HOME for this job
        run: |
          rm -rf "$RUNNER_TEMP/home"
          mkdir -m 700 "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Claude-side tests
        run: python3 -m pytest test/test_accounts.py test/test_claude_router.py test/test_codex_accounts.py test/test_codex_router.py test/test_scan_tokens.py test/test_agent_metrics.py test/test_remote_boards.py test/test_remote_jobs.py test/test_lane_ownership.py test/test_usage_ledger.py -q

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, sl-hound]
    timeout-minutes: 15
    steps:
      - name: Fresh HOME for this job
        run: |
          rm -rf "$RUNNER_TEMP/home"
          mkdir -m 700 "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - name: Runner sandbox
        run: |
          echo "user $(id -un), HOME $HOME"
          # The runner's unit hides /home; a job that can see it would reach andrew's files.
          if [ "$(id -un)" = andrew ] || ls /home/andrew >/dev/null 2>&1; then
            echo "::error::this job can reach /home/andrew; the runner is not sandboxed"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test empty input
        run: |
          OUTPUT=$(echo '' | bash bin/statusline.sh)
          [ "$OUTPUT" = "Claude" ] || { echo "FAIL: expected 'Claude', got '$OUTPUT'"; exit 1; }
          echo "PASS: empty input returns 'Claude'"
      - name: Test install script (dry run)
        run: |
          mkdir -p ~/.claude
          echo '{"permissions":{}}' > ~/.claude/settings.json
          bash install.sh
          [ -f ~/.claude/statusline.sh ] || { echo "FAIL: script not installed"; exit 1; }
          jq -e '.statusLine' ~/.claude/settings.json || { echo "FAIL: settings not patched"; exit 1; }
          echo "PASS: install script works"
      - name: Test account router installer
        run: bash test/test_install_account_router.sh
      - name: Test ledger functions
        run: bash test/test_ledger.sh
      - name: Test file_mtime portability
        run: bash test/test_file_mtime.sh
      - name: Test stdin rate limits and usage-poll backoff
        run: bash test/test_stdin_rate_limits.sh
      - name: Test unsupervised badge
        run: bash test/test_unsupervised_badge.sh
      - name: Test the status line with pins off
        run: bash test/test_pins_off_render.sh
      - name: Test shared account snapshot renderer
        run: bash test/test_shared_snapshot.sh
      - name: Test stable status line height
        run: bash test/test_stable_height.sh
      - name: Test a lane's owned PRs and photon lanes
        run: bash test/test_lane_ownership_render.sh
      - name: Test Agent Metrics launcher
        run: bash test/test_agent_metrics_wrapper.sh
      - name: Test transcript backups
        run: bash test/test_backup_scripts.sh
      - name: Test Codex monitor
        run: python3 test/test_codex_statusline.py
      - name: Test Codex statusline hangup
        run: bash test/test_codex_statusline_hangup.sh
      - name: Set up Python 3.9
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'
      - name: Test Codex monitor on Python 3.9
        run: python3.9 test/test_codex_statusline.py
